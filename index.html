window.runCode=(id,b)=>{const f=document.createElement('iframe');f.className='run';f.setAttribute('sandbox','allow-scripts');f.srcdoc=window.__code[id];b.parentNode.appendChild(f)};
document.getElementById('fc').onsubmit=async e=>{e.preventDefault();const q=document.getElementById('cq');const t=q.value.trim();if(!t)return;q.value='';

// ---- v7: gemini, vision, voice, admin ----
function sysNow(){const i=localStorage.ins;return SYS+(i?'\nتعليمات إضافية من المالك (التزم بيها): '+i:'')}
const GM=['gemini-3.6-flash','gemini-3.5-flash-lite'];
async function gem(contents,system){const key=localStorage.gk;if(!key)throw new Error('nokey');let last='';
 for(const m of GM){try{const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({systemInstruction:{parts:[{text:system}]},contents:contents})});
  if(r.status==400||r.status==403){const j=await r.json().catch(()=>({}));const msg=(j.error&&j.error.message)||'';if(/API key|PERMISSION|not valid/i.test(msg)||r.status==403)throw new Error('badkey');last=msg;continue}
  if(r.status==429||r.status==404||r.status>=500){last='busy '+r.status;continue}
  const j=await r.json();const c=j.candidates&&j.candidates[0];const t=c&&c.content&&c.content.parts?c.content.parts.map(p=>p.text||'').join('').trim():'';if(t)return t;last='empty'}
 catch(e){if(e.message=='badkey')throw e;last=e.message}}
 throw new Error('gem '+last)}
function toContents(h){return h.filter(x=>x.role!='system').slice(-12).map(x=>({role:x.role=='assistant'?'model':'user',parts:[{text:x.content}]}))}
async function tryGem(h){if(!localStorage.gk)return null;try{const sys=(h[0]&&h[0].role=='system')?h[0].content:sysNow();return await gem(toContents(h),sys)}catch(e){if(e.message=='badkey')throw new Error('مفتاح Gemini مش شغال. غيّره من الإعدادات.');return null}}
// attachments
let pend=null;
const attEl=document.getElementById('att'),fileIn=document.getElementById('fileIn');
function showAtt(){if(!pend){attEl.style.display='none';return}attEl.style.display='flex';attEl.style.cssText='display:flex;align-items:center;gap:10px';attEl.innerHTML='<img src="'+pend.thumb+'" style="height:54px;border-radius:10px"><span style="color:var(--mut);font-size:13px">'+pend.label+'</span><button type="button" class="btn g" style="padding:6px 12px;margin-inline-start:auto" id="attx">×</button>';document.getElementById('attx').onclick=()=>{pend=null;showAtt()}}
function frameFrom(src,w){const c=document.createElement('canvas');const k=Math.min(1,w/(src.videoWidth||src.naturalWidth||w));c.width=Math.round((src.videoWidth||src.naturalWidth)*k);c.height=Math.round((src.videoHeight||src.naturalHeight)*k);c.getContext('2d').drawImage(src,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.82)}
const b64=u=>u.split(',')[1];
document.getElementById('attb').onclick=()=>fileIn.click();
fileIn.onchange=async()=>{const f=fileIn.files[0];fileIn.value='';if(!f)return;const url=URL.createObjectURL(f);
 try{if(f.type.startsWith('image/')){const im=new Image();await new Promise((ok,no)=>{im.onload=ok;im.onerror=no;im.src=url});const d=frameFrom(im,1280);pend={kind:'image',parts:[{inline_data:{mime_type:'image/jpeg',data:b64(d)}}],thumb:d,label:'صورة جاهزة'}}
 else if(f.type.startsWith('video/')){const v=document.createElement('video');v.muted=true;v.playsInline=true;v.src=url;await new Promise((ok,no)=>{v.onloadedmetadata=ok;v.onerror=no});const n=6,fr=[];for(let i=0;i<n;i++){v.currentTime=Math.max(0.05,v.duration*(i+.5)/n);await new Promise(ok=>{v.onseeked=ok});fr.push(frameFrom(v,768))}
  pend={kind:'video',parts:fr.map(d=>({inline_data:{mime_type:'image/jpeg',data:b64(d)}})),thumb:fr[0],label:'فيديو ('+Math.round(v.duration)+' ثانية) اتقسم لـ '+n+' لقطات'}}
 else throw 0;showAtt()}catch(e){add('assistant','مقدرتش أقرا الملف ده.')}};
// voice replies
let vstop=false;
async function speakReply(t){if(localStorage.vo!='1')return;t=t.replace(/```[\s\S]*?```/g,' ').replace(/[*#_`>]/g,'').slice(0,700);if(!t.trim())return;stopFlag=false;const lang=/[\u0600-\u06FF]/.test(t)?'ar':'en';
 try{for(const c of chunks(t)){if(stopFlag)break;await playUrl('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl='+lang+'&q='+encodeURIComponent(c))}}catch(e){try{await speakLocal(t)}catch(e2){}}}
// chat
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const q=document.getElementById('q');let t=q.value.trim();if(!t&&!pend)return;q.value='';
 const p=pend;
 if(p){t=t||(p.kind=='video'?'دي لقطات متتالية من فيديو. اشرح اللي بيحصل فيه.':'اوصف الصورة دي بالتفصيل.');const d=add('user','',1);d.innerHTML='<img src="'+p.thumb+'" style="max-width:180px;border-radius:12px;display:block;margin-bottom:6px">'+t.replace(/</g,'&lt;');pend=null;showAtt()}else add('user',t);
 hist.push({role:'user',content:p?('['+(p.kind=='video'?'فيديو':'صورة')+'] '+t):t});const w=add('assistant',DOTS,1);
 try{let a;
  if(p){if(!localStorage.gk){hist.pop();w.textContent='عشان أشوف الصور والفيديو محتاج مفتاح Gemini المجاني. افتح الإعدادات > لوحة المالك وحطه (دقيقة واحدة).';return}
   const c=toContents(hist.slice(0,-1));c.push({role:'user',parts:[{text:(p.kind=='video'?'اللقطات دي مأخوذة بالترتيب من فيديو. ':'')+t},...p.parts]});a=await gem(c,sysNow())}
  else a=await ask(hist);
  w.textContent=a;hist.push({role:'assistant',content:a});localStorage.h=JSON.stringify(hist.slice(-40));speakReply(a)}
 catch(x){hist.pop();w.textContent='معرفتش أرد: '+(x.message=='badkey'?'مفتاح Gemini مش شغال':x.message)+'. اتأكد من النت وجرب تاني بعد شوية.'}};
// mic
const micb=document.getElementById('micb');let listening=false,rec=null;
function micState(on){listening=on;micb.style.boxShadow=on?'0 0 0 4px rgba(34,211,238,.5)':'';micb.style.background=on?'linear-gradient(135deg,#ef4444,#f97316)':''}
function micErr(c){micState(false);add('assistant',c==-2?'محتاج تسمحلي بالميكروفون من إعدادات الموبايل.':c==7||c==6?'مسمعتش حاجة، جرب تاني.':c==-1?'التعرف على الصوت مش متاح على الموبايل ده.':'التعرف على الصوت فشل (كود '+c+'). اتأكد من النت.')}
window.onSpeechPartial=t=>{document.getElementById('q').value=t};
window.onSpeech=t=>{micState(false);const q=document.getElementById('q');q.value=t;if(t.trim())document.getElementById('f').requestSubmit()};
window.onSpeechErr=micErr;
micb.onclick=()=>{if(listening){micState(false);if(window.Android&&Android.stopListen)Android.stopListen();if(rec)rec.stop();return}
 if(window.Android&&Android.canListen&&Android.canListen()){micState(true);Android.listen();return}
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){add('assistant','الميكروفون محتاج تطبيق الأندرويد (النسخة 4) أو متصفح كروم.');return}
 rec=new SR();rec.lang='ar-EG';rec.interimResults=true;rec.onresult=ev=>{const r=ev.results[ev.results.length-1];const t=r[0].transcript;if(r.isFinal)window.onSpeech(t);else window.onSpeechPartial(t)};rec.onerror=ev=>micErr(ev.error=='not-allowed'?-2:ev.error=='no-speech'?7:-1);rec.onend=()=>micState(false);micState(true);rec.start()};
// admin panel (PIN on device only)
let unlocked=false;
function hsh(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (h2>>>0).toString(16)+(h1>>>0).toString(16)}
async function pinHash(p){const s=localStorage.pins||'';const str=s+':'+p;if(window.crypto&&crypto.subtle){try{const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){}}return hsh(str)}
const adm=document.getElementById('admin');
function renderAdmin(msg){const m=msg?'<p style="color:var(--b)">'+msg+'</p>':'';
 if(!localStorage.pinh){adm.innerHTML='<div class="card" style="display:block">اعمل كود سري (4 أرقام أو أكتر) يفتح لوحة المالك. بيتخزن على موبايلك بس.<br><br><input id="pn" type="password" inputmode="numeric" placeholder="الكود" style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:#fff"><br><br><button class="btn" id="pset">احفظ الكود</button>'+m+'</div>';
  document.getElementById('pset').onclick=async()=>{const p=document.getElementById('pn').value.trim();if(p.length<4)return renderAdmin('الكود لازم 4 على الأقل');localStorage.pins=Math.random().toString(36).slice(2);localStorage.pinh=await pinHash(p);unlocked=true;renderAdmin('اتحفظ.')};return}
 if(!unlocked){adm.innerHTML='<div class="card" style="display:block"><input id="pn" type="password" inputmode="numeric" placeholder="الكود" style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:#fff"><br><br><button class="btn" id="pgo">فتح</button>'+m+'</div>';
  document.getElementById('pgo').onclick=async()=>{if(await pinHash(document.getElementById('pn').value.trim())===localStorage.pinh){unlocked=true;renderAdmin()}else renderAdmin('الكود غلط')};return}
 const k=localStorage.gk?'متسجل (••••'+localStorage.gk.slice(-4)+')':'مش متسجل';
 adm.innerHTML='<div class="card" style="display:block"><b>مفتاح Gemini المجاني</b> <small>'+k+'</small><br>بيفتح رؤية الصور والفيديو وشات أقوى. اعمله من <a href="https://aistudio.google.com/apikey" target="_blank" style="color:var(--b)">aistudio.google.com/apikey</a> وألصقه هنا. بيتخزن على موبايلك بس.<br><br><input id="gk" type="password" placeholder="الصق المفتاح" style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:#fff;direction:ltr"><br><br><button class="btn" id="gks">حفظ المفتاح</button> <button class="btn g" id="gkd">مسح</button></div>'+
 '<div class="card" style="display:block"><b>تعليمات للمساعد</b><br><small>اكتب اللي عايزه يلتزم بيه دايماً (أسلوب، معلومات عنك...)</small><br><br><textarea id="ins" rows="4" style="width:100%">'+(localStorage.ins||'').replace(/</g,'&lt;')+'</textarea><br><br><button class="btn" id="inss">حفظ التعليمات</button></div>'+
 '<div class="card" style="display:block"><label><input type="checkbox" id="vo" '+(localStorage.vo=='1'?'checked':'')+'> اقرا ردود الشات بصوت</label></div>'+
 '<button class="btn g" id="plock">قفل اللوحة</button> <button class="btn g" id="preset">مسح الكود والبيانات</button>'+m;
 document.getElementById('gks').onclick=()=>{const v=document.getElementById('gk').value.trim();if(v.length<20)return renderAdmin('المفتاح قصير، اتأكد إنك نسخته كامل');localStorage.gk=v;renderAdmin('اتحفظ المفتاح.')};
 document.getElementById('gkd').onclick=()=>{delete localStorage.gk;renderAdmin('اتمسح.')};
