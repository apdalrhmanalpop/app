<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ApdalrhmanAlpop</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:sans-serif;background:#0f1220;color:#eee;display:flex;flex-direction:column;height:100vh}
header{padding:12px;background:#1b2040;font-weight:bold;text-align:center}
nav{display:flex}nav button{flex:1;padding:12px 2px;background:#151a33;color:#aab;border:0;font-size:15px}nav button.on{background:#2a3270;color:#fff}
section{display:none;flex:1;overflow:auto;padding:10px}section.on{display:flex;flex-direction:column}
#msgs{flex:1;overflow:auto}.m{margin:6px 0;padding:9px 12px;border-radius:12px;max-width:85%;white-space:pre-wrap}.u{background:#3b4bd8;margin-inline-start:auto}.b{background:#242a4d}
form{display:flex;gap:6px;margin-top:8px}input{flex:1;padding:12px;border-radius:10px;border:0;background:#1b2040;color:#fff;font-size:16px}
form button,.btn{padding:12px 16px;border:0;border-radius:10px;background:#4f63ff;color:#fff;font-size:15px}
.card{display:block;background:#1b2040;border-radius:12px;padding:12px;margin:8px 0;color:#fff;text-decoration:none}.card small{color:#9ab;display:block;margin-top:4px}
textarea{width:100%;padding:12px;border-radius:10px;border:0;background:#1b2040;color:#fff;font-size:16px}img.gen{width:100%;border-radius:12px;margin:8px 0}pre{background:#0a0d1a;padding:10px;border-radius:10px;overflow:auto;direction:ltr;text-align:left;white-space:pre-wrap;font-size:13px}iframe.run{width:100%;height:320px;border:0;background:#fff;border-radius:10px}</style></head><body>
<header>ApdalrhmanAlpop <span id="ver" style="font-weight:normal;font-size:11px"></span></header>
<nav><button class="on" data-t="chat">شات</button><button data-t="img">صور</button><button data-t="aud">صوت</button><button data-t="code">برمجة</button><button data-t="video">فيديو AI</button><button data-t="upd">تحديث</button></nav>
<section id="chat" class="on"><div id="msgs"></div><form id="f"><input id="q" placeholder="اكتب رسالتك..." autocomplete="off"><button>إرسال</button></form></section>
<section id="img"><div id="imgout" style="flex:1;overflow:auto"></div><form id="fi"><input id="iq" placeholder="وصف الصورة (عربي أو إنجليزي)" autocomplete="off"><button>اعمل</button></form></section>
<section id="aud"><textarea id="at" rows="6" placeholder="اكتب النص اللي عايز تسمعه..."></textarea><div style="display:flex;gap:6px;margin-top:8px"><button class="btn" id="play">شغّل الصوت</button><button class="btn" id="stop" style="background:#555">وقف</button></div><p id="as"></p></section>
<section id="code"><div id="codeout" style="flex:1;overflow:auto"></div><form id="fc"><input id="cq" placeholder="اوصف البرنامج اللي عايزه..." autocomplete="off"><button>اكتب</button></form></section>
<section id="video"><div id="tools"></div></section>
<section id="upd"><p id="us">جاهز.</p><button class="btn" onclick="checkUpdate()">دوّر على تحديث</button></section>
<script>
const VERSION=5, UPDATE_URL="https://apdalrhmanalpop.github.io/app/version.json";
document.getElementById('ver').textContent='v'+VERSION;
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,section').forEach(e=>e.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.t).classList.add('on')});
const T=[["PixVerse","https://app.pixverse.ai","رصيد يومي مجاني + صوت"],["Pika","https://pika.art","كريدت مجاني"],["Luma Dream Machine","https://lumalabs.ai/dream-machine","كليبات مجانية محدودة"],["Pollo AI","https://pollo.ai","كريدت يومي صغير"],["Hedra","https://www.hedra.com","شخصيات بتتكلم"],["Higgsfield","https://higgsfield.ai","كريدت مجاني"],["Google Flow","https://labs.google/flow","حسب حسابك"],["Google Vids","https://docs.google.com/videos","حصة شهرية"],["Freepik","https://www.freepik.com/ai/video-generator","كريدت يومي"],["Leonardo","https://app.leonardo.ai","رصيد يومي"],["Krea","https://www.krea.ai","فيديو مجاني محدود"],["Dzine","https://www.dzine.ai","كريدت مجاني"]];
document.getElementById('tools').innerHTML='<p>كل موقع له حد مجاني. اتفتح في المتصفح وسجل بحسابك.</p>'+T.map(t=>`<a class="card" href="${t[1]}" target="_blank">${t[0]}<small>${t[2]}</small></a>`).join('');
const msgs=document.getElementById('msgs');let hist=JSON.parse(localStorage.h||'[]');
function add(r,t){const d=document.createElement('div');d.className='m '+(r=='user'?'u':'b');d.textContent=t;msgs.appendChild(d);msgs.scrollTop=1e9;return d}
hist.forEach(m=>add(m.role,m.content));if(!hist.length)add('assistant','أهلاً! أنا ApdalrhmanAlpop. اسألني أي حاجة بالعربي.');
const SYS='انت ApdalrhmanAlpop، مساعد ذكي جوه تطبيق موبايل بيتكلم مصري عامية بشكل طبيعي وودود. اشرح بالتفصيل وبخطوات واضحة لما السؤال محتاج، واختصر لما السؤال بسيط. التطبيق فيه تابات: شات، وفيديو AI (روابط لمواقع بتولّد فيديو مجاناً زي PixVerse وPika وLuma وPollo وHedra وHiggsfield وFlow وVids وFreepik وLeonardo وKrea وDzine)، وتحديث. التطبيق فيه كمان تاب صور (بيولّد صور مجاناً)، وتاب صوت (بيقرا أي نص بصوت)، وتاب برمجة (بيكتب كود ويشغّل صفحات HTML). انت نفسك مبتولّدش فيديو، بس بتساعد في كل اللي حواليه: كتابة فكرة وسيناريو مشهد بمشهد، كتابة برومبت جاهز بالإنجليزي للصقه في موقع الفيديو (وصف الشخصيات والكاميرا والإضاءة والحركة والحوار)، اقتراح الموقع الأنسب وإزاي تستغل الرصيد المجاني، عناوين ووصف وهاشتاجات لليوتيوب، وأفكار قنوات. لو حد طلب فيديو، متقولش مقدرش وبس: اسأله عن الفكرة والمدة واللغة، اكتب له البرومبت، ووجهه لتاب فيديو AI يفتح الموقع المناسب. متخترعش معلومات عن حدود المواقع المجانية ولو مش متأكد قول كده.';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function ask(h,own){const msgs=(h[0]&&h[0].role=='system')?h:[{role:'system',content:SYS},...h.slice(-12)];let err='';
 const tries=[['openai','post'],['mistral','post'],['openai','get'],['llama','post']];
 for(let i=0;i<tries.length;i++){const [m,k]=tries[i];
  try{let r;const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),25000);
   if(k=='post')r=await fetch('https://text.pollinations.ai/openai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:m,messages:msgs}),signal:ctl.signal});
   else{const q=encodeURIComponent(msgs.slice(-4).map(x=>x.content).join('\n'));r=await fetch('https://text.pollinations.ai/'+q.slice(0,1500)+'?model='+m+'&system='+encodeURIComponent(SYS),{signal:ctl.signal})}
   clearTimeout(to);
   if(r.status==429||r.status>=500){err='الخدمة مشغولة ('+r.status+')';await sleep(2000*(i+1));continue}
   if(!r.ok){err='خطأ '+r.status;continue}
   let a;if(k=='post'){const j=await r.json();a=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content}else a=await r.text();
   if(a&&a.trim())return a.trim();err='رد فاضي'}
  catch(e){err=navigator.onLine?'مفيش اتصال بالخدمة':'مفيش إنترنت';await sleep(1500*(i+1))}}
 throw new Error(err||'فشل')}
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const q=document.getElementById('q');const t=q.value.trim();if(!t)return;q.value='';add('user',t);hist.push({role:'user',content:t});const w=add('assistant','...بفكر');
 try{const a=await ask(hist);w.textContent=a;hist.push({role:'assistant',content:a});localStorage.h=JSON.stringify(hist.slice(-40))}
 catch(x){hist.pop();w.textContent='معرفتش أرد: '+x.message+'. اتأكد من النت وجرب تاني بعد شوية.'}};

// ---- images ----
function iAdd(h){const d=document.createElement('div');d.className='m b';d.style.maxWidth='100%';d.innerHTML=h;const o=document.getElementById('imgout');o.appendChild(d);o.scrollTop=1e9;return d}
async function toEnglish(t){if(!/[\u0600-\u06FF]/.test(t))return t;try{const a=await ask([{role:'user',content:'Translate this into a short detailed English image-generation prompt. Reply with only the prompt: '+t}]);return a.replace(/^["']|["']$/g,'')}catch(e){return t}}
async function horde(prompt){const H={'apikey':'0000000000','Content-Type':'application/json','Client-Agent':'apdalrhmanalpop:4:app'};
 const r=await fetch('https://aihorde.net/api/v2/generate/async',{method:'POST',headers:H,body:JSON.stringify({prompt:prompt,params:{width:512,height:512,steps:20,n:1},nsfw:false,models:['stable_diffusion']})});
 const j=await r.json();if(!j.id)throw new Error(j.message||'horde');
 for(let i=0;i<40;i++){await sleep(3000);const c=await (await fetch('https://aihorde.net/api/v2/generate/check/'+j.id)).json();if(c.faulted)throw new Error('faulted');if(c.done){const s=await (await fetch('https://aihorde.net/api/v2/generate/status/'+j.id)).json();const g=s.generations&&s.generations[0];if(g&&g.img)return g.img;throw new Error('no img')}}
 throw new Error('timeout')}
async function polli(prompt){const u='https://image.pollinations.ai/prompt/'+encodeURIComponent(prompt)+'?model=sana&width=512&height=512&nologo=true&seed='+Math.floor(Math.random()*1e6);
 const r=await fetch(u);if(!r.ok)throw new Error('polli '+r.status);const b=await r.blob();return URL.createObjectURL(b)}
document.getElementById('fi').onsubmit=async e=>{e.preventDefault();const q=document.getElementById('iq');const t=q.value.trim();if(!t)return;q.value='';
 iAdd(t.replace(/</g,'&lt;'));const w=iAdd('...بجهّز الصورة (ممكن ياخد لحد دقيقة)');
 try{const en=await toEnglish(t);let url;try{url=await horde(en)}catch(x1){url=await polli(en)}
  w.innerHTML='<img class="gen" src="'+url+'"><a href="'+url+'" target="_blank" style="color:#9ab">فتح الصورة (اضغط مطولاً للحفظ)</a>'}
 catch(x){w.textContent='معرفتش أعمل الصورة: '+x.message+'. جرب تاني بعد شوية.'}};
// ---- audio ----
let aud=null,stopFlag=false;
function chunks(t){const out=[];let cur='';t.split(/(?<=[.!?؟،,\n])\s*/).forEach(p=>{if((cur+' '+p).length>170){if(cur)out.push(cur);cur=p}else cur=(cur+' '+p).trim()});if(cur)out.push(cur);return out.flatMap(c=>{const r=[];while(c.length>170){r.push(c.slice(0,170));c=c.slice(170)}r.push(c);return r}).filter(x=>x.trim())}
function playUrl(u){return new Promise((res,rej)=>{aud=new Audio(u);aud.onended=res;aud.onerror=()=>rej(new Error('audio'));aud.play().catch(rej)})}
function speakLocal(t){return new Promise((res,rej)=>{if(!window.speechSynthesis)return rej(new Error('no tts'));const u=new SpeechSynthesisUtterance(t);u.lang='ar-EG';u.onend=res;u.onerror=()=>rej(new Error('tts'));speechSynthesis.speak(u)})}
document.getElementById('stop').onclick=()=>{stopFlag=true;if(aud)aud.pause();if(window.speechSynthesis)speechSynthesis.cancel()};
document.getElementById('play').onclick=async()=>{const t=document.getElementById('at').value.trim();const s=document.getElementById('as');if(!t)return;stopFlag=false;s.textContent='بشغّل...';
 const lang=/[\u0600-\u06FF]/.test(t)?'ar':'en';const cs=chunks(t);
 try{for(const c of cs){if(stopFlag)break;await playUrl('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl='+lang+'&q='+encodeURIComponent(c))}s.textContent=''}
 catch(e){try{s.textContent='بجرب صوت الموبايل...';await speakLocal(t);s.textContent=''}catch(e2){s.textContent='الصوت مشتغلش: '+e2.message}}};
// ---- code ----
const CSYS='You are an expert programmer. Reply in Egyptian Arabic for explanations, but code and comments in English. For anything that can run in a browser, deliver ONE complete self-contained HTML file (inline CSS and JS) inside a single ```html block so it can run directly. Otherwise give complete code in a fenced block with the language name, then a short explanation of how to run it.';
function esc(x){return x.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function cAdd(h){const d=document.createElement('div');d.className='m b';d.style.maxWidth='100%';d.innerHTML=h;const o=document.getElementById('codeout');o.appendChild(d);o.scrollTop=1e9;return d}
window.__code=[];
function renderCode(text){let out='';const parts=text.split(/```/);parts.forEach((p,i)=>{if(i%2==0){out+='<div style="white-space:pre-wrap">'+esc(p)+'</div>'}else{const m=p.match(/^(\w*)\n/);const lang=m?m[1].toLowerCase():'';const body=m?p.slice(m[0].length):p;const id=window.__code.push(body)-1;
 out+='<pre>'+esc(body)+'</pre><button class="btn" onclick="navigator.clipboard&&navigator.clipboard.writeText(window.__code['+id+'])">نسخ</button>';
 if(lang=='html'||/^\s*<(!doctype|html)/i.test(body))out+=' <button class="btn" onclick="runCode('+id+',this)">شغّل</button>'}});return out}
window.runCode=(id,b)=>{const f=document.createElement('iframe');f.className='run';f.setAttribute('sandbox','allow-scripts');f.srcdoc=window.__code[id];b.parentNode.appendChild(f)};
document.getElementById('fc').onsubmit=async e=>{e.preventDefault();const q=document.getElementById('cq');const t=q.value.trim();if(!t)return;q.value='';
 cAdd(esc(t));const w=cAdd('...بكتب الكود');
 try{const a=await ask([{role:'system',content:CSYS},{role:'user',content:t}],true);w.innerHTML=renderCode(a)}catch(x){w.textContent='معرفتش أكتب الكود: '+x.message}};
async function checkUpdate(){const s=document.getElementById('us');const av=(window.Android&&Android.appVersion)?Android.appVersion():0;
try{const j=await (await fetch(UPDATE_URL+'?t='+Date.now())).json();if(j.apk_version>av){s.innerHTML='فيه نسخة تطبيق جديدة. <button class="btn" onclick="Android.download(\''+j.apk+'\')">حمّلها</button>'}else{s.textContent='التطبيق محدّث. نسخة الواجهة '+VERSION+' بتتحدث لوحدها.'}}catch(e){s.textContent='مقدرتش أتصل بالتحديث.'}}
checkUpdate();
</script></body></html>
