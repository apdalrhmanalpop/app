function micState(on){listening=on;micb.style.boxShadow=on?'0 0 0 4px rgba(34,211,238,.5)':'';micb.style.background=on?'linear-gradient(135deg,#ef4444,#f97316)':''}
function micErr(c){micState(false);if(vmode){if(c==7||c==6){setTimeout(()=>{if(vmode)startMic()},700);return}vmode=false;vmb.style.background=''}add('assistant',c==-2?'محتاج تسمحلي بالميكروفون من إعدادات الموبايل.':c==7||c==6?'مسمعتش حاجة، جرب تاني.':c==-1?'التعرف على الصوت مش متاح على الموبايل ده.':'التعرف على الصوت فشل (كود '+c+'). اتأكد من النت.')}

function startMic(){
 if(window.Android&&Android.canListen&&Android.canListen()){micState(true);Android.listen();return}
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){add('assistant','الميكروفون محتاج تطبيق الأندرويد (النسخة 4) أو متصفح كروم.');return}
 rec=new SR();rec.lang='ar-EG';rec.interimResults=true;rec.onresult=ev=>{const r=ev.results[ev.results.length-1];const t=r[0].transcript;if(r.isFinal)window.onSpeech(t);else window.onSpeechPartial(t)};rec.onerror=ev=>micErr(ev.error=='not-allowed'?-2:ev.error=='no-speech'?7:-1);rec.onend=()=>micState(false);micState(true);rec.start()}
micb.onclick=()=>{if(listening){micState(false);if(window.Android&&Android.stopListen)Android.stopListen();if(rec)rec.stop();return}startMic()};

function hsh(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (h2>>>0).toString(16)+(h1>>>0).toString(16)}
async function pinHash(p){const s=localStorage.pins||'';const str=s+':'+p;if(window.crypto&&crypto.subtle){try{const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){}}return hsh(str)}
